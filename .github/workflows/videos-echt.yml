name: Echte AI-video's maken (open source)

# Maakt echte video's van fictieve personen zonder account of API-sleutel:
# gezicht (Stable Diffusion 1.5 / Realistic Vision), Nederlandse stem (Piper)
# en pratend hoofd met lipsync (SadTalker). Alles open source, op de CPU.
#
# 1. gezichten: één job per persona zonder gezicht (daarna in git bewaard)
# 2. clips: per persona in 'delen' parallelle jobs (CPU is traag)
# 3. bewaren: alleen gekeurde clips naar git, daarna de site publiceren
# Tip: eerst een proef met persona 'henk' en fragment 'intro'.

on:
  workflow_dispatch:
    inputs:
      personas:
        description: "Persona's, met komma's (leeg = alle)"
        required: false
        default: ''
      segmenten:
        description: 'Alleen deze fragmenten, met komma''s (leeg = alle), bijv. intro'
        required: false
        default: ''
      delen:
        description: 'Parallelle jobs per persona (1-5)'
        required: false
        default: '3'
      verbeteren:
        description: 'Gezicht verscherpen met GFPGAN (trager, maar echter)'
        type: boolean
        default: true
      publiceren:
        description: 'Daarna de site opnieuw publiceren (met alle tests)'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: videos-echt
  cancel-in-progress: false

env:
  SADTALKER_COMMIT: cd4c0465ae0b54a6f85af57f5c65fec9fe23e7f8

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      personas: ${{ steps.p.outputs.personas }}
      zonder_gezicht: ${{ steps.p.outputs.zonder_gezicht }}
      delen: ${{ steps.p.outputs.delen }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: p
        env:
          KEUZE: ${{ github.event.inputs.personas }}
          DELEN: ${{ github.event.inputs.delen }}
        run: |
          node -e '
            const { existsSync } = require("node:fs");
            import("./src/calc/uitleg.js").then(({ PERSONAS }) => {
              const alle = Object.keys(PERSONAS);
              const keuze = (process.env.KEUZE || "").split(",").map((s) => s.trim()).filter(Boolean);
              const onbekend = keuze.filter((p) => !alle.includes(p));
              if (onbekend.length) { console.error("Onbekende persona: " + onbekend); process.exit(1); }
              const personas = keuze.length ? keuze : alle;
              const zonder = personas.filter((p) => !existsSync(`public/video/gezichten/${p}.jpg`));
              const n = Math.min(5, Math.max(1, parseInt(process.env.DELEN || "3", 10) || 3));
              console.log("personas=" + JSON.stringify(personas));
              console.log("zonder_gezicht=" + JSON.stringify(zonder.length ? zonder : ["-"]));
              console.log("delen=" + JSON.stringify(Array.from({ length: n }, (_, i) => `${i + 1}/${n}`)));
            });' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  gezichten:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        persona: ${{ fromJson(needs.plan.outputs.zonder_gezicht) }}
    env:
      HF_HOME: ${{ github.workspace }}/.video-cache/hf
    steps:
      - uses: actions/checkout@v4
        if: matrix.persona != '-'
      - uses: ./.github/actions/video-omgeving
        if: matrix.persona != '-'
        with:
          sadtalker-commit: ${{ env.SADTALKER_COMMIT }}
      - name: Gezicht maken voor ${{ matrix.persona }}
        if: matrix.persona != '-'
        run: |
          mkdir -p uit-video/gezichten
          python scripts/video/gezichten.py --persona "${{ matrix.persona }}" --uit uit-video/gezichten --gewichten .sadtalker/gfpgan/weights
      - uses: actions/upload-artifact@v4
        if: matrix.persona != '-'
        with:
          name: video-gezicht-${{ matrix.persona }}
          path: uit-video/
          retention-days: 14

  clips:
    needs: [plan, gezichten]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        persona: ${{ fromJson(needs.plan.outputs.personas) }}
        deel: ${{ fromJson(needs.plan.outputs.delen) }}
    env:
      VIDEO_CACHE: ${{ github.workspace }}/.video-cache
      HF_HOME: ${{ github.workspace }}/.video-cache/hf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/video-omgeving
        with:
          sadtalker-commit: ${{ env.SADTALKER_COMMIT }}
      - name: Nieuw gemaakt gezicht ophalen
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: video-gezicht-${{ matrix.persona }}
          path: uit-gezicht
      - name: Video's maken voor ${{ matrix.persona }} (deel ${{ matrix.deel }})
        env:
          VIDEO_PYTHON: python
          SEGMENTEN: ${{ github.event.inputs.segmenten }}
        run: |
          if [ -f "uit-gezicht/gezichten/${{ matrix.persona }}.jpg" ]; then
            mkdir -p public/video/gezichten && cp uit-gezicht/gezichten/${{ matrix.persona }}.* public/video/gezichten/
          fi
          node scripts/maak-echte-videos.js --persona "${{ matrix.persona }}" --deel "${{ matrix.deel }}" --sadtalker "$PWD/.sadtalker" --uit uit-video \
            ${{ github.event.inputs.verbeteren == 'true' && '--verbeteren' || '' }} \
            ${SEGMENTEN:+--segmenten "$SEGMENTEN"}
      - name: Contactblad om te bekijken (1 beeld per seconde)
        if: always()
        run: |
          mkdir -p uit-video/contactblad
          for f in uit-video/${{ matrix.persona }}/*.mp4; do
            [ -e "$f" ] || continue
            ffmpeg -loglevel error -y -i "$f" -vf "fps=1,scale=144:-1,tile=6x1" -frames:v 1 "uit-video/contactblad/$(basename "$f" .mp4).jpg"
          done
      - name: Naam van het artefact
        id: naam
        if: always()
        run: echo "naam=video-${{ matrix.persona }}-$(echo '${{ matrix.deel }}' | tr '/' 'v')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.naam.outputs.naam }}
          path: uit-video/
          if-no-files-found: ignore
          retention-days: 14

  bewaren:
    needs: clips
    if: always() && needs.clips.result != 'cancelled' && needs.clips.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: video-*
          path: artefacten
      - name: Samenvoegen (alleen gekeurde clips)
        run: |
          [ -d artefacten ] || { echo "Geen video's gemaakt"; exit 1; }
          find artefacten -name 'keuring.*.json' -exec sh -c 'echo "── $1"; cat "$1"' _ {} \;
          node scripts/video-samenvoegen.js artefacten
      - name: Bewaren in git
        run: |
          git config user.name "toeslagbuddy-video"
          git config user.email "video@users.noreply.github.com"
          git add public/video
          git diff --cached --quiet && { echo "Geen nieuwe clips"; exit 0; }
          git commit -m "Echte AI-video's bijgewerkt $(date +%F)"
          # GitHub geeft soms een tijdelijke fout (500): opnieuw proberen, eerst bijwerken
          for poging in 1 2 3 4 5; do
            git pull --rebase -q origin "${{ github.ref_name }}" && git push && exit 0
            echo "Push mislukt (poging $poging), opnieuw over $((poging * 10)) s"; sleep $((poging * 10))
          done
          exit 1
      - name: Site opnieuw publiceren (tests draaien eerst)
        if: github.event.inputs.publiceren == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}"
