name: Uitlegvideo's maken

# Maakt de uitlegvideo's van Familie, Besparen en Toeslagen: geanimeerde
# scènes in de huisstijl (scripts/video/uitleg-scenes.js), ingebrande
# ondertitels en een open-source Nederlandse voice-over (Piper). Geen
# pratende hoofden, geen echte personen. Draait alleen opnieuw als de
# scènes veranderen; de video's gaan naar public/video/uitleg/ in git.

on:
  workflow_dispatch:
    inputs:
      opnieuw:
        description: 'Alles opnieuw maken, ook als er niets is veranderd'
        type: boolean
        default: false
      ai_max:
        description: 'Maximaal aantal nieuwe AI-beelden (Veo) in deze run; 0 = geen'
        default: '12'
  push:
    paths:
      - scripts/video/uitleg-scenes.js
      - scripts/video/uitleg.js
      - data/video/beelden/*.mp4

permissions:
  contents: write

concurrency:
  group: uitlegvideos
  cancel-in-progress: true

jobs:
  maken:
    runs-on: ubuntu-24.04 # Playwright 1.56 ondersteunt Ubuntu 26.04 (ubuntu-latest) nog niet
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y ffmpeg
      - uses: actions/cache@v4
        with:
          path: ~/.cache/piper
          key: piper-stemmen-v1
      # Filmische AI-beelden met Veo (Gemini API). Alleen als de eigenaar het
      # geheim GEMINI_API_KEY heeft ingesteld; elke prompt kost één keer geld,
      # daarna staat de clip in git. Zonder sleutel blijven de video's zoals ze zijn.
      - name: Met de hand toegevoegde beelden verkleinen
        run: node scripts/video/ai-beelden.js --verklein
      - name: AI-beelden (Veo)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_MAX: ${{ github.event.inputs.ai_max }}
        run: |
          max="${AI_MAX:-12}"
          [[ "$max" =~ ^[0-9]+$ ]] || max=12
          [ "$max" = "0" ] && { echo "AI-beelden overgeslagen"; exit 0; }
          node scripts/video/ai-beelden.js --max "$max"
      - name: Voice-over (Piper)
        run: |
          python -m pip install -q piper-tts==1.8.0
          node scripts/video/uitleg.js --teksten /tmp/teksten.json
          python scripts/video/uitleg_stem.py --teksten /tmp/teksten.json --map ~/.cache/piper --uit /tmp/stem
      - name: Video's renderen
        env:
          OPNIEUW: ${{ github.event.inputs.opnieuw }}
        run: |
          node build.js
          args=(--stem /tmp/stem)
          [[ "$OPNIEUW" == "true" ]] && args+=(--opnieuw)
          node scripts/video/uitleg.js "${args[@]}"
          ls -la public/video/uitleg
      - name: Bewaren in git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/video/uitleg data/video/beelden
          git diff --cached --quiet && { echo "Niets veranderd"; exit 0; }
          git commit -m "Uitlegvideo's bijgewerkt $(date -u +%F)"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
