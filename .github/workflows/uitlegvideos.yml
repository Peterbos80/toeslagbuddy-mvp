name: Uitlegvideo's maken

# Maakt de uitlegvideo's van Familie, Besparen en Toeslagen: geanimeerde
# scènes in de huisstijl (scripts/video/uitleg-scenes.js), ingebrande
# ondertitels en een open-source Nederlandse voice-over (Piper). Geen
# pratende hoofden, geen echte personen. Draait alleen opnieuw als de
# scènes veranderen; de video's gaan naar public/video/uitleg/ in git.

on:
  workflow_dispatch:
    inputs:
      opnieuw:
        description: 'Alles opnieuw maken, ook als er niets is veranderd'
        type: boolean
        default: false
      ai_max:
        description: 'Maximaal aantal nieuwe AI-beelden (Veo) in deze run; 0 = geen'
        default: '12'
  workflow_run:
    workflows: ["AI-beelden maken (gratis, Kaggle)"]
    types: [completed]
  push:
    paths:
      - scripts/video/uitleg-scenes.js
      - scripts/video/uitleg.js
      - data/video/beelden/*.mp4

permissions:
  contents: write

concurrency:
  group: uitlegvideos
  cancel-in-progress: true

jobs:
  maken:
    runs-on: ubuntu-24.04 # Playwright 1.56 ondersteunt Ubuntu 26.04 (ubuntu-latest) nog niet
    timeout-minutes: 180 # liggend en verticaal (1080 × 1920 is trager)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y ffmpeg
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/piper
            ~/.cache/huggingface
            ~/.cache/torch
            .tts
          key: stemmen-v2
      - name: Met de hand toegevoegde beelden verkleinen
        run: node scripts/video/ai-beelden.js --verklein
      # Echte stockvideo's van Pixabay of Pexels (gratis, commercieel toegestaan).
      # Alleen met het geheim PIXABAY_API_KEY of PEXELS_API_KEY; ontbrekende scènes worden daarna eventueel
      # nog met AI gevuld.
      - name: Stockbeelden (Pixabay of Pexels)
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/video/stock-beelden.js
      - name: AI-beelden (Veo)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_MAX: ${{ github.event.inputs.ai_max }}
        run: |
          max="${AI_MAX:-12}"
          [[ "$max" =~ ^[0-9]+$ ]] || max=12
          [ "$max" = "0" ] && { echo "AI-beelden overgeslagen"; exit 0; }
          node scripts/video/ai-beelden.js --max "$max"
      # Natuurlijke stem: Chatterbox Multilingual (open source, MIT) spreekt de
      # teksten in met de klankkleur van een Piper-referentie. Per fragment de
      # beste volgens UTMOS; lukt Chatterbox niet, dan blijft Piper.
      - name: Voice-over (natuurlijke stem)
        run: |
          [ -x .tts/bin/python ] || python -m venv .tts
          .tts/bin/pip install -q --upgrade pip wheel
          .tts/bin/pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
          .tts/bin/pip install -q chatterbox-tts piper-tts==1.8.0
          node scripts/video/uitleg.js --teksten /tmp/teksten.json
          .tts/bin/python scripts/video/uitleg_stem.py --teksten /tmp/teksten.json --map ~/.cache/piper --uit /tmp/stem
          mkdir -p /tmp/stem-nat
          node scripts/video/stem_kies.js opdracht /tmp/teksten.json /tmp/stem /tmp/stem-nat
          timeout 75m .tts/bin/python scripts/video/stem_natuurlijk.py --opdracht /tmp/stem-nat/opdracht.json --doorgaan --expressie 0.4 --cfg 0.45 || echo "Chatterbox niet (helemaal) gelukt: Piper blijft waar nodig"
          node scripts/video/stem_kies.js kies /tmp/stem /tmp/stem-nat
      - name: Video's renderen
        env:
          OPNIEUW: ${{ github.event.inputs.opnieuw }}
        run: |
          node build.js
          args=(--stem /tmp/stem)
          [[ "$OPNIEUW" == "true" ]] && args+=(--opnieuw)
          node scripts/video/uitleg.js "${args[@]}"
          ls -la public/video/uitleg
      # Dezelfde scènes, stem en ondertitels in 9:16 (1080 × 1920) voor
      # Instagram Reels en TikTok: public/video/uitleg/<id>-verticaal.mp4.
      # Eigen vingerafdruk in verticaal.json: alleen opnieuw als er iets veranderde.
      - name: Verticale video's renderen (Reels/TikTok)
        env:
          OPNIEUW: ${{ github.event.inputs.opnieuw }}
        run: |
          args=(--verticaal --stem /tmp/stem)
          [[ "$OPNIEUW" == "true" ]] && args+=(--opnieuw)
          node scripts/video/uitleg.js "${args[@]}"
          ls -la public/video/uitleg
      - name: Bewaren in git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/video/uitleg data/video/beelden
          git diff --cached --quiet && { echo "Niets veranderd"; exit 0; }
          git commit -m "Uitlegvideo's bijgewerkt $(date -u +%F)"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
