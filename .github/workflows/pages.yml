name: Publiceer op GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 5 * * *' # elke ochtend rond 07:15: nieuws ophalen en opnieuw publiceren
  workflow_run:
    workflows: ["AI-video's maken"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Nieuws ophalen (mag mislukken; dan blijft het vorige nieuws staan)
        run: node scripts/nieuws.js
        continue-on-error: true
      - run: node build.js
      - name: Instagram-afbeeldingen en video's maken
        run: |
          sudo apt-get install -y ffmpeg
          node social/render.js
          node social/video.js
      - name: Tests (rekenregels, links, gestructureerde gegevens)
        run: npm test
      - name: Browsertests en toegankelijkheid – publiceren gebeurt alleen als alles slaagt
        run: npm run test:e2e
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
