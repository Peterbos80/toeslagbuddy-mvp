name: Test en deploy naar TransIP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-en-deploy:
    runs-on: ubuntu-latest
    env:
      TRANSIP_HOST: ${{ secrets.TRANSIP_HOST }}
      TRANSIP_USER: ${{ secrets.TRANSIP_USER }}
      TRANSIP_PASSWORD: ${{ secrets.TRANSIP_PASSWORD }}
      REMOTE_DIR: ${{ secrets.TRANSIP_REMOTE_DIR || 'www' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Nieuws ophalen (mag mislukken; dan blijft het vorige nieuws staan)
        run: node scripts/nieuws.js
        continue-on-error: true
      - run: node build.js
      - name: Instagram-afbeeldingen en video's maken
        run: |
          sudo apt-get install -y ffmpeg
          node social/render.js
          node social/video.js
      - name: Tests (rekenregels, links, gestructureerde gegevens)
        run: npm test
      - name: Browsertests en toegankelijkheid – publiceren gebeurt alleen als alles slaagt
        run: npm run test:e2e
      - name: Upload naar TransIP (alleen op main, als de secrets zijn ingesteld)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.TRANSIP_HOST != ''
        run: |
          sudo apt-get install -y lftp
          lftp -u "$TRANSIP_USER","$TRANSIP_PASSWORD" "sftp://$TRANSIP_HOST" -e "set sftp:auto-confirm yes; set net:max-retries 3; mirror --reverse --delete --parallel=4 dist/ $REMOTE_DIR/; bye"
      - name: Controleer of de site bereikbaar is
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.TRANSIP_HOST != ''
        run: |
          URL=$(node -e "import('./site.config.js').then(c=>console.log(c.default.url))")
          curl -fsS -o /dev/null -w "%{http_code} $URL\n" "$URL/" || echo "::warning::Site nog niet bereikbaar op $URL (DNS of SSL nog niet actief?)"
